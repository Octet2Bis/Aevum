name: Aevum
options:
  bundleIdPrefix: com.aevum
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Aevum:
    type: application
    platform: iOS
    sources:
      - path: AevumApp
    entitlements:
      path: AevumApp/Resources/Aevum.entitlements
    info:
      path: AevumApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Aevum"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    dependencies:
      - target: AevumShield
      - target: AevumShieldAction
      - target: AevumActivityMonitor
    scheme: {}

  # Tests logiques sans application hôte : les sources de Core sont compilées
  # dans le bundle, comme la cible AevumAppCore de Package.swift.
  AevumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: AevumApp/Core
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - AevumTests

  AevumShield:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/AevumShield
    dependencies:
      - sdk: ManagedSettingsUI.framework
      - sdk: ManagedSettings.framework

  AevumShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/AevumShieldAction
    dependencies:
      - sdk: ManagedSettings.framework

  AevumActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/AevumActivityMonitor
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
