name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web simulator · server tests + data parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static server (localhost only, path traversal, null byte)
        run: node web_preview/tests/server.test.js
      - name: iOS and web catalogues are identical (SHA-256)
        run: node scripts/check-parity.mjs

  ios:
    name: iOS · build app + extensions, run XCTest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen && xcodegen generate
          # Report every compile error in one run, not only the first failing file
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build the app and its 3 Screen Time extensions
        run: >
          xcodebuild -project Aevum.xcodeproj -scheme Aevum
          -destination "id=${{ steps.sim.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests (catalogue, biological age, circadian engine)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: >
          xcodebuild -project Aevum.xcodeproj -scheme AevumTests
          -destination "id=${{ steps.sim.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO test
